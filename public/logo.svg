<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#312e81" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="2" y="2" width="36" height="36" rx="10" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" fill="none" />

  <!-- Keyboard Keycap Graphic -->
  <rect x="7" y="7" width="26" height="26" rx="6" fill="url(#glowGrad)" />

  <!-- Keyboard Rows / Keys graphic -->
  <!-- Top key row -->
  <rect x="10" y="11" width="5" height="4" rx="1.5" fill="#ffffff" fill-opacity="0.9" />
  <rect x="17.5" y="11" width="5" height="4" rx="1.5" fill="#ffffff" fill-opacity="0.9" />
  <rect x="25" y="11" width="5" height="4" rx="1.5" fill="#ffffff" fill-opacity="0.9" />

  <!-- Middle key row (Home row with highlighted index key) -->
  <rect x="9" y="17" width="5" height="4" rx="1.5" fill="#ffffff" fill-opacity="0.9" />
  <rect x="16" y="17" width="8" height="4" rx="1.5" fill="#34d399" /> <!-- Highlighted Home key -->
  <rect x="26" y="17" width="5" height="4" rx="1.5" fill="#ffffff" fill-opacity="0.9" />

  <!-- Spacebar -->
  <rect x="11" y="23" width="18" height="4" rx="2" fill="#ffffff" fill-opacity="0.95" />

  <!-- Tactile Guide Dot -->
  <circle cx="20" cy="19" r="0.75" fill="#064e3b" />
</svg>
